server:
  port: 8001
  forward-headers-strategy: framework

spring:
  application:
    name: "web-api-service"

  config:
    import: optional:file:web-api-service/.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

  cloud:
    loadbalancer:
      cache:
        # 레지스트리 조회 주기에 맞춰 LB 인스턴스 캐시도 줄인다 (기본 35s)
        ttl: 5s
    openfeign:
      httpclient:
        hc5:
          enabled: true
      client:
        config:
          # 게이트웨이 기본 response-timeout(5s) 안에 순차 호출 2회가 끝나도록 잡는다: 2 x (500 + 1800) = 4.6s
          default:
            connectTimeout: 500
            readTimeout: 1800
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}          # 카카오 디벨로퍼스에서 발급받은 REST API 키
            client-secret: ${KAKAO_CLIENT_SECRET}  # (선택 사항이나 보안상 활성화 권장)
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao" # 카카오 디벨로퍼스 설정과 일치해야 함
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id # 카카오 사용자 정보의 Key값 (기본 id)

swagger:
  info:
    paths-to-match:
      - "/api/v1/**"

springdoc:
  api-docs:
    path: /api/v1/web-api/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  use-fqn: true

# ECS 컨테이너 헬스체크용. liveness는 DB·Redis·ES 상태를 합산하지 않아 외부 의존 장애로 연쇄 재시작되지 않는다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    # 배포로 내려간 인스턴스를 빨리 목록에서 빼도록 레지스트리 조회 주기를 줄인다 (기본 30s)
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_SERVERS}/eureka

app:
  jwt:
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000} # 14일
  frontend:
    redirect-uri: ${FRONTEND_REDIRECT_URI}
  cookie:
    secure: ${COOKIE_SECURE:false}
