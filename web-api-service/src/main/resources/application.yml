server:
  port: 8001
  forward-headers-strategy: framework

spring:
  application:
    name: "web-api-service"

  config:
    import:
      - optional:file:web-api-service/.env[.properties]
      # 공통 로깅 설정 (common/support/logging)
      - classpath:logging.yml
      # 공통 모니터링 설정 (common/support/monitoring)
      - classpath:monitoring.yml

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

  cloud:
    loadbalancer:
      cache:
        # 레지스트리 조회 주기에 맞춰 LB 인스턴스 캐시도 줄인다 (기본 35s)
        ttl: 5s
    openfeign:
      httpclient:
        hc5:
          enabled: true
          connection-request-timeout: 500
          connection-request-timeout-unit: milliseconds
        max-connections-per-route: 100
      client:
        config:
          # 타임아웃 예산: 검색(2s) + 프로필(1.5s) = 3.5s < 게이트웨이 response-timeout(5s)
          # 모든 프로필에 같은 값을 쓰므로 프로필 yml에서 덮어쓰지 않는다
          default:
            connectTimeout: 1000
            readTimeout: 1500
          SearchPostClient:
            readTimeout: 2000
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}          # 카카오 디벨로퍼스에서 발급받은 REST API 키
            client-secret: ${KAKAO_CLIENT_SECRET}  # (선택 사항이나 보안상 활성화 권장)
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao" # 카카오 디벨로퍼스 설정과 일치해야 함
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id # 카카오 사용자 정보의 Key값 (기본 id)

# 서킷 브레이커: 하위 서비스 단위 4개
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        # 기본 readTimeout(1.5s)보다 짧게 잡아 타임아웃에 닿기 전에 느려지는 추세를 센다
        slow-call-duration-threshold: 1s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 5xx·타임아웃·연결 실패만 실패로 센다. 4xx(비즈니스 예외)는 성공으로 집계된다
        record-failure-predicate: com.traveler.web.global.resilience.DownstreamFailurePredicate
    instances:
      member-service:
        base-config: default
      post-service:
        base-config: default
      search-service:
        base-config: default
        # 검색 readTimeout이 2s라 1s 기준이면 정상 검색도 느린 호출로 많이 집계될 수 있다
        slow-call-duration-threshold: 1500ms
      user-activity-service:
        base-config: default

swagger:
  info:
    paths-to-match:
      - "/api/v1/**"

# Swagger는 기본으로 끄고 local 프로필에서만 켠다
springdoc:
  api-docs:
    enabled: false
    path: /api/v1/web-api/v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  use-fqn: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    # 배포로 내려간 인스턴스를 빨리 목록에서 빼도록 레지스트리 조회 주기를 줄인다 (기본 30s)
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_SERVERS}/eureka

app:
  jwt:
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000} # 14일
  frontend:
    redirect-uri: ${FRONTEND_REDIRECT_URI}
  cookie:
    secure: ${COOKIE_SECURE:false}
