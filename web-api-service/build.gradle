plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.traveler'
version = '0.0.1-SNAPSHOT'
description = 'web-api-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2024.0.1")
}


dependencies {
    // Common Module
    implementation project(':common:api')
    implementation project(':common:support:logging')
    implementation project(':common:support:monitoring')

    // Web & Lombok
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Testcontainers (@Tag("integration") 테스트, ./gradlew integrationTest)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'

    // 하위 서비스 HTTP 응답 스텁 (Feign 에러 변환·타임아웃 테스트)
    testImplementation 'org.wiremock:wiremock-standalone:3.10.0'
    testAnnotationProcessor 'org.projectlombok:lombok'

    //Eureka
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.0'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.0'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 회원 닉네임 로컬 캐시 (MemberNicknameCache)
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // OpenFeign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'io.github.openfeign:feign-hc5'
    // Feign 호출에 observation을 걸어 trace 헤더(traceparent)를 하위 서비스로 전달
    implementation 'io.github.openfeign:feign-micrometer'

    // 서킷 브레이커 (Resilience4j). Spring Cloud CircuitBreaker 연동은 쓰지 않고 DownstreamCallExecutor에서 직접 호출한다.
    // Spring Cloud 연동은 기본 설정에서 호출을 다른 스레드로 넘겨, 요청 스레드에 저장된 인증 정보(UserContextHolder)가
    // Feign 헤더에 실리지 않는다.
    implementation 'io.github.resilience4j:resilience4j-spring-boot3'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
