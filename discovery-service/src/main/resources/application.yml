server:
  port: 8761 #???? ??

spring:
  application:
    name: discovery

eureka:
  client:
    register-with-eureka: false # default : true
    fetch-registry: false # default : true
  server:
    # 등록 취소가 클라이언트의 레지스트리 조회에 바로 반영되도록 읽기 전용 응답 캐시(기본 30초마다 갱신)를 쓰지 않는다
    use-read-only-response-cache: false
