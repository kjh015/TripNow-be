server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: "post-service"

  config:
    import: optional:file:post-service/.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all # (선택) 발행 보장 수준 (0, 1, all)
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: traveler-group # 소비자 그룹 ID
      auto-offset-reset: earliest # 오프셋 정보가 없을 때 시작 위치 (latest, earliest)
      enable-auto-commit: false # 자동 커밋 여부
    listener:
      concurrency: 3 # 리스너의 병렬 처리 수준 (보통 파티션 개수와 맞춤)
      ack-mode: manual_immediate # 메시지 수신 확인 모드 (manual_immediate: 로직 완료 후 즉시 커밋)

  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET}
      region:
        static: ap-northeast-2
#      credentials:
#        access-key: ${AWS_ACCESS_KEY_ID}
#        secret-key: ${AWS_SECRET_ACCESS_KEY}


swagger:
  info:
    paths-to-match:
      - "/v1/posts/**"
      - "/v1/comments/**"
      - "/v1/likes/**"

springdoc:
  api-docs:
    path: /v1/posts/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ECS 컨테이너 헬스체크용. liveness는 DB·Redis·ES 상태를 합산하지 않아 외부 의존 장애로 연쇄 재시작되지 않는다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVERS}/eureka

app:
  kafka:
    topics:
      post-events: "post-service.post.events"
      post-commands: "post-service.post.commands"
      comment-events: "post-service.comment.events"
      like-events: "post-service.like.events"
      view-events: "user-activity-service.post.events.viewed"