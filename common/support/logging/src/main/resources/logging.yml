# 서비스 공통 로깅 설정. 각 서비스 application.yml의 spring.config.import로 가져온다.
# import된 파일의 값은 가져온 application.yml보다 우선하므로, 서비스마다 달라야 하는 값은 여기에 두지 않는다.
# (프로필 파일 application-{profile}.yml은 이 파일보다 우선한다)
logging:
  pattern:
    # 요청 사용자 ID(MDC userId)를 레벨 옆에 붙인다. 요청 밖 로그는 '-'
    level: "%5p [userId:%X{userId:--}]"
  level:
    # 기동 시 Kafka ConsumerConfig·ProducerConfig 설정 덤프 제거
    org.apache.kafka: WARN
    # 감사 로그는 서비스 로그 레벨 설정과 무관하게 항상 남긴다
    AUDIT: INFO

---
# 배포 환경(dev = 배포 테스트 서버, prod): 콘솔 로그를 한 줄 JSON(ECS)으로 출력해 ELK가 파싱 없이 적재한다.
# MDC(userId 등)와 SLF4J key-value(감사 로그의 action·actor·target)는 같은 이름의 JSON 필드가 된다.
# 로컬과 프로필 미지정 실행은 위의 사람이 읽는 형식을 유지한다.
spring.config.activate.on-profile: dev | prod
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}

---
spring.config.activate.on-profile: dev
logging.structured.ecs.service.environment: dev

---
spring.config.activate.on-profile: prod
logging.structured.ecs.service.environment: prod
