plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0' apply false
}

allprojects {
    group = 'module'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
}

tasks.named('test') {
	useJUnitPlatform()
}


tasks.named('bootJar') { enabled = false }
tasks.named('jar') { enabled = false }

// Spotless 상세 설정
subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'

    // 모든 서브 모듈에 적용될 Spotless 설정
    spotless {
        java {
            palantirJavaFormat()
            importOrder()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    // 외부 인프라(MySQL·Kafka·Redis·ES)를 Testcontainers로 띄우는 테스트는 @Tag("integration")을 붙인다.
    // test는 Docker 없이 도는 단위·슬라이스 테스트만, integrationTest는 통합 테스트만 실행한다.
    tasks.withType(Test).configureEach {
        useJUnitPlatform {
            if (name == 'integrationTest') {
                includeTags 'integration'
            } else {
                excludeTags 'integration'
            }
        }
    }

    tasks.register('integrationTest', Test) {
        description = 'Runs @Tag("integration") tests (Testcontainers, Docker required).'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        shouldRunAfter tasks.named('test')
    }
}

// Git Hook을 설치하는 태스크
tasks.register('installGitHooks', Copy) {
    // scripts/pre-commit 파일을
    from new File(rootProject.rootDir, 'scripts/pre-commit')
    // .git/hooks 폴더로 복사
    into { new File(rootProject.rootDir, '.git/hooks') }
    // 복사 시점에 실행 권한 강제 부여 (Unix-like OS)
    doLast {
        def hookFile = new File(rootProject.rootDir, '.git/hooks/pre-commit')
        if (hookFile.exists()) {
            hookFile.setExecutable(true)
        }
    }
}
tasks.named('clean') {
    dependsOn 'installGitHooks'
}
tasks.named('build') {
    dependsOn 'installGitHooks'
}
