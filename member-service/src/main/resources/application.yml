server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: "member-service"

  config:
    import:
      - optional:file:member-service/.env[.properties]
      # 공통 로깅 설정 (common/support/logging)
      - classpath:logging.yml
      # 공통 모니터링 설정 (common/support/monitoring)
      - classpath:monitoring.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

  # 회원 이벤트를 발행(Outbox)하고, post-service의 정리 완료 이벤트를 소비한다.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      # 운영 메모리 기준값(앱 EC2 t3.small 한 대에 JVM 7개). 클라이언트 기본값은 32MB 버퍼, 16KB 배치
      buffer-memory: 8MB
      batch-size: 8KB
      compression-type: gzip
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 다른 서비스(traveler-group)와 그룹을 나눠 리밸런싱이 서로 영향을 주지 않게 한다
      group-id: member-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
    listener:
      concurrency: 1
      ack-mode: manual_immediate

swagger:
  info:
    paths-to-match:
      - "/v1/members/**"
      - "/v1/auth/**"
      - "/v1/admin/members/**"

# Swagger는 기본으로 끄고 local 프로필에서만 켠다
springdoc:
  api-docs:
    enabled: false
    path: /v1/members/v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  use-fqn: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVERS}/eureka

app:
  jwt:
    # 서명에 쓰는 현재 개인 JWK. kid가 public-jwks에 있어야 한다
    private-jwk: ${JWT_PRIVATE_JWK}
    # 검증에 쓰는 공개 JWK Set({"keys":[...]}). 게이트웨이와 같은 값을 쓴다
    public-jwks: ${JWT_PUBLIC_JWKS}
    access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}  # 1시간
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000} # 14일
  kafka:
    topics:
      member-events: "member-service.member.events"
      content-events: "post-service.content.events"