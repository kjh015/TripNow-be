server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: "member-service"

  config:
    import: optional:file:member-service/.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

swagger:
  info:
    paths-to-match:
      - "/v1/members/**"
      - "/v1/auth/**"
      - "/v1/admin/members/**"

springdoc:
  api-docs:
    path: /v1/members/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  use-fqn: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVERS}/eureka

app:
  jwt:
    # 서명에 쓰는 현재 개인 JWK. kid가 public-jwks에 있어야 한다
    private-jwk: ${JWT_PRIVATE_JWK}
    # 검증에 쓰는 공개 JWK Set({"keys":[...]}). 게이트웨이와 같은 값을 쓴다
    public-jwks: ${JWT_PUBLIC_JWKS}
    access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}  # 1시간
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000} # 14일