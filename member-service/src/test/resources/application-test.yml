# 통합 테스트 프로필. DB·Redis 연결은 IntegrationTestSupport의 컨테이너(@ServiceConnection)가 덮어쓴다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test
    username: test
    password: test
  jpa:
    hibernate:
      # 운영은 validate. 테스트 DB는 비어 있으므로 엔티티로 스키마를 만든다
      ddl-auto: create
  data:
    redis:
      host: localhost
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: member-service-test

eureka:
  client:
    enabled: false
