server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: "user-activity-service"

  config:
    import:
      - optional:file:user-activity-service/.env[.properties]
      # 공통 로깅 설정 (common/support/logging)
      - classpath:logging.yml
      # 공통 모니터링 설정 (common/support/monitoring)
      - classpath:monitoring.yml

  elasticsearch:
    # 값 형식은 "호스트:포트" (스킴 없음). ElasticsearchConfig의
    # ClientConfiguration.connectedTo() 가 host:port 를 기대한다.
    uris: ${ELASTICSEARCH_URIS}
    # ES 보안(xpack.security.enabled: true) 계정.
    # ※ 이 두 줄만으로는 적용되지 않는다 — global/config/ElasticsearchConfig 가
    #    이 값을 읽어 withBasicAuth() 로 넘긴다. 비어 있으면 인증 없이 접속.
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      # 운영 메모리 기준값(앱 EC2 t3.small 한 대에 JVM 7개). 클라이언트 기본값은 32MB 버퍼, 16KB 배치
      buffer-memory: 8MB
      batch-size: 8KB
      compression-type: gzip
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: user-activity-default-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50 # 기본 500
    listener:
      concurrency: 1 # 운영은 트래픽이 적고 메모리가 빠듯해 1. local 프로필에서 3
      ack-mode: manual_immediate

  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET}
      region:
        static: ap-northeast-2


logging:
  pattern:
    # PID/앱이름을 걷어내고, 반복되는 식별자는 MDC 컬럼(trace/event/ref)으로 분리
    # trace는 파이프라인의 로그 추적 ID, traceId는 분산 추적 ID(Kafka 수신 span)로 서로 다른 값이다
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p) %clr(%-32.32X{traceId:-}){faint} %clr(%-8.8X{trace:-}){faint} %clr(%-22.22X{event:-}){magenta} %clr(%-18.18X{ref:-}){cyan} %clr(%-16.16logger{0}){faint} %clr(:){faint} %m%n%wEx"
  level:
    # 파이프라인 단계별 상세(수신 로그, 원본 path 등)가 필요하면 DEBUG로 변경
    com.traveler.useractivity.domain.process: INFO

swagger:
  info:
    paths-to-match:
      - "/v1/admin/log-processes/**"
      - "/v1/admin/format-rules/**"
      - "/v1/admin/filter-rules/**"
      - "/v1/admin/dedup-rules/**"
      - "/v1/admin/histories/**"

# Swagger는 기본으로 끄고 local 프로필에서만 켠다
springdoc:
  api-docs:
    enabled: false
    path: /v1/user-activity/v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVERS}/eureka

app:
  kafka:
    topics:
      format-stream: "user-activity-service.process.format.stream"
      filter-stream: "user-activity-service.process.filter.stream"
      dedup-stream: "user-activity-service.process.dedup.stream"
      sink-stream: "user-activity-service.process.sink.stream"
      view-events: "user-activity-service.post.events.viewed"
    groups:
      format: "user-activity-format-group"
      filter: "user-activity-filter-group"
      dedup: "user-activity-dedup-group"
      sink: "user-activity-sink-group"
  elasticsearch:
    indices:
      # v2: log_data 하위 필드를 dynamic_templates로 색인 (Kibana 대시보드 집계용)
      history: "histories_2"


