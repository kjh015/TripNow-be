# 통합 테스트 프로필. 연결 주소는 IntegrationTestSupport가 컨테이너 값으로 덮어쓴다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test
    username: test
    password: test
  jpa:
    hibernate:
      # 운영은 validate. 테스트 DB는 비어 있으므로 엔티티로 스키마를 만든다
      ddl-auto: create
  elasticsearch:
    uris: localhost:9200
  data:
    redis:
      host: localhost
  kafka:
    bootstrap-servers: localhost:9092
  cloud:
    aws:
      s3:
        bucket: tripnow-test-bucket

eureka:
  client:
    enabled: false
