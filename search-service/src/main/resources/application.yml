server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: "search-service"

  config:
    import: optional:file:search-service/.env[.properties]

  elasticsearch:
    # 값 형식은 "호스트:포트" (스킴 없음). ElasticsearchConfig의
    # ClientConfiguration.connectedTo() 가 host:port 를 기대한다.
    uris: ${ELASTICSEARCH_URIS}
    # ES 보안(xpack.security.enabled: true) 계정.
    # ※ 이 두 줄만으로는 적용되지 않는다 — global/config/ElasticsearchConfig 가
    #    이 값을 읽어 withBasicAuth() 로 넘긴다. 비어 있으면 인증 없이 접속.
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all # (선택) 발행 보장 수준 (0, 1, all)
      retries: 3
      # 운영 메모리 기준값(앱 EC2 t3.small 한 대에 JVM 7개). 클라이언트 기본값은 32MB 버퍼, 16KB 배치
      buffer-memory: 8MB
      batch-size: 8KB
      compression-type: gzip
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: traveler-group # 소비자 그룹 ID
      auto-offset-reset: earliest # 오프셋 정보가 없을 때 시작 위치 (latest, earliest)
      enable-auto-commit: false # 자동 커밋 여부
      max-poll-records: 50 # 기본 500
    listener:
      concurrency: 1 # 운영은 트래픽이 적고 메모리가 빠듯해 1. local 프로필에서 3
      ack-mode: manual_immediate # 메시지 수신 확인 모드 (manual_immediate: 로직 완료 후 즉시 커밋)

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

swagger:
  info:
    paths-to-match:
      - "/v1/search/**"

# Swagger는 기본으로 끄고 local 프로필에서만 켠다
springdoc:
  api-docs:
    enabled: false
    path: /v1/search/v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

logging:
  level:
    # 기동 시 ConsumerConfig·ProducerConfig 설정 덤프 제거
    org.apache.kafka: WARN

# ECS 컨테이너 헬스체크용. liveness는 DB·Redis·ES 상태를 합산하지 않아 외부 의존 장애로 연쇄 재시작되지 않는다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVERS}/eureka

app:
  kafka:
    topics:
      post-events: "post-service.post.events"
      comment-events: "post-service.comment.events"
      like-events: "post-service.like.events"
  elasticsearch:
    indices:
      post: "posts"
      comment: "comments"
      like: "likes"
