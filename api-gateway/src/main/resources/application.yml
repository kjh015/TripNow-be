server:
  port: 8000

spring:
  application:
    name: api-gateway

  config:
    import: optional:file:api-gateway/.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      # 블랙리스트 조회가 인증 경로에 있으므로 무응답 Redis에 오래 매달리지 않게 한다 (Lettuce 기본값 60s)
      timeout: 500ms
      connect-timeout: 500ms

  web:
    resources:
      add-mappings: true

  cloud:
    loadbalancer:
      cache:
        # 레지스트리 조회 주기에 맞춰 LB 인스턴스 캐시도 줄인다 (기본 35s)
        ttl: 5s
    gateway:
      routes:
        - id: web-api-service-signup
          uri: lb://web-api-service
          predicates:
            - Path=/api/v1/members
            - Method=POST

        - id: web-api-service-search-me
          uri: lb://web-api-service
          predicates:
            - Path=/api/v1/search/*/me
          filters:
            - name: JwtAuthenticationFilter

        - id: web-api-service-guest
          uri: lb://web-api-service
          predicates:
            - Path=/api/v1/search/**, /api/v1/web-api/v3/api-docs/**, /api/v1/rankings/live,
              /api/v1/auth/login, /api/v1/auth/tokens/refresh, /api/v1/auth/oauth2/**,
              /login/oauth2/code/**, /api/v1/members/availability/**

        - id: web-api-service-user
          uri: lb://web-api-service
          predicates:
            - Path=/api/v1/posts/**, /api/v1/comments/**, /api/v1/likes/**, /api/v1/members/**, /api/v1/auth/**
          filters:
            - name: JwtAuthenticationFilter

        - id: web-api-service-admin
          uri: lb://web-api-service
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - name: JwtAuthenticationFilter
            - name: RoleAuthorizationFilter
              args:
                requiredRole: ROLE_ADMIN


#        - id: post-service-docs
#          uri: lb://post-service
#          predicates:
#            - Path=/v1/posts/v3/api-docs/**
#
#        - id: search-service-docs
#          uri: lb://search-service
#          predicates:
#            - Path=/v1/search/v3/api-docs/**
#
#        - id: member-service-docs
#          uri: lb://member-service
#          predicates:
#            - Path=/v1/members/v3/api-docs/**
#
#        - id: user-activity-service-docs
#          uri: lb://user-activity-service
#          predicates:
#            - Path=/v1/user-activity/v3/api-docs/**


      httpclient:
        connect-timeout: 5000
        response-timeout: 5s

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${ALLOWED_ORIGINS:http://localhost:3000}
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Authorization"
              - "Set-Cookie"
            allowedMethods:
              - "GET"
              - "POST"
              - "DELETE"
              - "PUT"
              - "PATCH"
              - "OPTIONS"
            allowCredentials: true
            maxAge: 3600


eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    # 배포로 내려간 인스턴스를 빨리 목록에서 빼도록 레지스트리 조회 주기를 줄인다 (기본 30s)
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_SERVERS}/eureka

#security key
app:
  jwt:
    # 공개 JWK Set({"keys":[...]}). 토큰 헤더의 kid로 검증 키를 고른다
    public-jwks: ${JWT_PUBLIC_JWKS}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  enable-native-support: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: Web Api Service
        url: /api/v1/web-api/v3/api-docs/web-api-service
#      - name: Post Service Docs
