# 배포 테스트 서버
spring:
  config:
    activate:
      on-profile: dev

  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000 # 빠른 연결 실패 유도
        response-timeout: 3s
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${ALLOWED_ORIGINS:https://tripnow.shop}
            allowedHeaders: ["Content-Type", "Authorization"]
            allowedMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            allowCredentials: true
