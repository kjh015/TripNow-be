spring:
  config:
    activate:
      on-profile: local

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # 하위 서비스 문서 라우트는 LocalApiDocsRouteConfig가 local 프로필에서만 등록한다
    urls:
      - name: Web Api Service
        url: /api/v1/web-api/v3/api-docs/web-api-service
      - name: Post Service Docs
        url: /v1/posts/v3/api-docs/post-service
      - name: Search Service Docs
        url: /v1/search/v3/api-docs/search-service
      - name: Member Service Docs
        url: /v1/members/v3/api-docs/member-service
      - name: UserActivity Service Docs
        url: /v1/user-activity/v3/api-docs/user-activity-service

app:
  rate-limit:
    # 로컬에서는 Rate Limiting을 끈다. 부하테스트(k6)와 시드가 IP 하나에서 요청을 몰아 보내기 때문.
    # 꺼지면 RateLimitFilter가 Redis를 부르지 않고 그대로 통과시킨다
    # 로컬에서 429를 확인하려면 APP_RATE_LIMIT_ENABLED=true로 띄워야 한다
    enabled: false
