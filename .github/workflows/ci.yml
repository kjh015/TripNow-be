name: CI

on:
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:

# 같은 PR/브랜치에 새 커밋이 오면 이전 실행은 취소합니다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read    # dorny/paths-filter가 PR 변경 파일 목록을 조회할 때 필요

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 포맷 위반은 컴파일보다 먼저, 빠르게 잡습니다.
      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Build & Test
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 도커 이미지가 실제로 빌드되는지까지 확인합니다.
  # 컴파일 자체는 build 잡이 이미 검증하므로, 이미지 빌드에 영향을 주는 파일이
  # 바뀐 경우(또는 수동 실행)에만 돌립니다.
  # ---------------------------------------------------------------------------
  docker-changes:
    name: Detect Docker-related changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'Dockerfile*'
              - '.dockerignore'
              - 'settings.gradle'
              - 'build.gradle'
              - 'gradle.properties'
              - 'gradle/**'
              - '*/build.gradle'
              - 'common/*/build.gradle'
              - '.github/workflows/ci.yml'

  docker-build-check:
    name: Docker build check (api-gateway)
    needs: docker-changes
    # 수동 실행에서는 docker-changes 가 skip 되므로 always() 로 평가를 이어갑니다.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.docker-changes.outputs.docker == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ vars.DOCKERFILE_PATH || 'Dockerfile' }}
          build-args: TARGET=api-gateway
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,mode=max,scope=api-gateway
